embedding:
  model_name: text-embedding-3-large  
  normalize: true
  min_dimension: 3072
  api_provider: openai
  model_dimension: 3072  
  api_key_env: OPENAI_API_KEY
  encode_kwargs:
    normalize_embeddings: true
    batch_size: 32  
    dimensions: 3072  

