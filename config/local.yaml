embedding:
  model_name: text-embedding-3-large
  normalize: true
  min_dimension: 1024
  api_provider: openai
  model_dimension: 1024
  api_key_env: OPENAI_API_KEY
  encode_kwargs:
    normalize_embeddings: true

backend:
  chroma_dir: ./.chroma
  collection_name: code_index
  persist_directory: ./.chroma

indexing:
  local_repo_root: ./repos
  local_paths: ["./repos/cds-web"]
  include_globs: ["**/*"]
  exclude_globs: ["**/.git/**","**/.github/**","**/node_modules/**","**/dist/**","**/build/**","**/*.min.js","**/*.png","**/*.jpg","**/*.jpeg","**/*.pdf","**/__pycache__/**","**/venv/**","**/.venv/**","**/target/**","**/bin/**"]
  max_file_mb: 2.0
  chunk_size: 1200  # Optimized for 100+ repos
  chunk_overlap: 150
  batch_size: 4000  # Increased for faster processing
  github_token_env: GITHUB_TOKEN
  github_auth_required: false
  max_retries: 3
  timeout: 30
  force_reindex: false  # Disable for incremental updates
  enable_incremental: true
  parallelism: 4
  cache_embeddings: true

retrieval:
  top_k: 10  # Increased for better coverage
  alpha_hybrid: 0.3
  use_reranker: true
  cross_encoder_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  similarity_threshold: 0.3  # Lower threshold for more results
  max_context_docs: 12
  max_context_tokens: 800  # Aggressive limit for cost optimization
  include_file_context: true
  boost_same_language: true
  enable_caching: true
  cache_ttl: 300

server:
  host: 0.0.0.0
  port: 8000

chat:
  provider: openai
  model: gpt-4
  temperature: 0.1
  api_key_env: OPENAI_API_KEY
  max_tokens: 800  # Reduced for cost optimization

current_method: openai
app_env: local

# Alternative Gemini configuration (uncomment to use):
# chat:
#   provider: gemini
#   model: gemini-1.5-flash
#   temperature: 0.1
#   api_key_env: GEMINI_API_KEY
#   max_tokens: 4096
# current_method: gemini

logging:
  level: INFO
  file: ./logs/app.log
  enable_cost_tracking: true
  cost_log_file: ./logs/cost_history.log
  log_token_usage: true